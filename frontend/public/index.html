<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d2818" />

    <!-- Primary SEO tags -->
    <title>EcoMart — Sustainable E-Commerce for a Greener Nepal</title>
    <meta name="description" content="Shop eco-friendly products, earn Green Points, donate waste for recycling, and redeem rewards — EcoMart is Nepal's sustainable online marketplace." />
    <meta name="keywords" content="EcoMart, eco-friendly shopping Nepal, sustainable products Nepal, online shopping Nepal, recycling Nepal, green rewards, zero waste Nepal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://my-full-stack-project-one.vercel.app/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EcoMart — Sustainable E-Commerce for a Greener Nepal" />
    <meta property="og:description" content="Shop eco-friendly products, earn Green Points, donate waste for recycling, and redeem rewards." />
    <meta property="og:url" content="https://my-full-stack-project-one.vercel.app/" />
    <meta property="og:site_name" content="EcoMart" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EcoMart — Sustainable E-Commerce for a Greener Nepal" />
    <meta name="twitter:description" content="Shop eco-friendly products, earn Green Points, donate waste for recycling, and redeem rewards." />

    <meta name="google-site-verification" content="qxf_R-BT6OFO74mnj2IkSCB1kz44Rjhhx-X0DcorcSQ" />

    <!-- PWA: manifest + icons — required for "Install App" to be offered -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EcoMart" />

    <!-- Register service worker here (not in index.js) so Chrome/Android
         recognizes the PWA as early as possible, enabling the install prompt -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('EcoMart SW registered:', registration.scope);
            },
            (err) => {
              console.warn('EcoMart SW registration failed:', err);
            }
          );
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
